[package]
name = "evildoom"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Evil: a Doom bot that explores and finishes levels, playing DSDA-Doom in-process"

[lib]
name = "evildoom"
path = "src/lib.rs"

[[bin]]
name = "evil-boom"
path = "src/main.rs"

[features]
default = ["viewer"]
# the `evil-boom watch` window (minifb: Windows, X11/Wayland); off for a headless build
viewer = ["dep:minifb", "dep:font8x8", "dep:png"]

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
minifb = { version = "0.28", optional = true }
font8x8 = { version = "0.3", optional = true }
png = { version = "0.17", optional = true }

# (no LTO, 16 codegen units, incremental: a change rebuilds in ~12s, not ~110s; the bot runs
# under 1% slower, measured on MAP17 and a 4-map sweep)
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
debug = 1
