[package]
name = "evilboom"
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Evil: a Doom bot that explores and finishes levels, playing DSDA-Doom in-process"
authors = ["Quarkboy"]
repository = "https://github.com/quarkboy/evil-boom"
readme = "../README.md"
keywords = ["doom", "bot", "game-ai", "neuro-sama"]
publish = false

[lib]
name = "evilboom"
path = "src/lib.rs"

[[bin]]
name = "evil-boom"
path = "src/main.rs"

[features]
default = ["viewer"]
# the `evil-boom watch` window (the engine's SDL) and the score's (minifb: Windows, X11); off
# for a headless build
viewer = ["dep:minifb", "dep:font8x8", "dep:png", "dep:fontdue"]

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# (the Neuro integration's WebSocket: plain ws:// to a local server, no TLS)
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# (the GPT stand-in for Evil: an OpenAI-compatible chat API over HTTPS)
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# (the score's window. X11 only: its Wayland window has no decorations where the compositor gives none, WSLg among
# them; X11 windows get them there and on Wayland desktops through XWayland)
minifb = { version = "0.28", optional = true, default-features = false, features = ["x11"] }
font8x8 = { version = "0.3", optional = true }
png = { version = "0.17", optional = true }
# (the stream console's web page and API, evil-boom console: plain HTTP, small and threaded)
tiny_http = { version = "0.12", default-features = false }
fontdue = { version = "0.9.5", optional = true }

# (no LTO, 16 codegen units, incremental: a change rebuilds in ~12s, not ~110s; the bot runs
# under 1% slower, measured on MAP17 and a 4-map sweep)
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
debug = 1
