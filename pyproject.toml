[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evil-doom"
version = "0.0.1"
description = "DOOM integration for Evil Neuro / Neuro-sama via the Neuro SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vizdoom = ["vizdoom>=1.3.2"]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
